<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" width="760" height="330"><rect width="760" height="330" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8b91a1"/></marker></defs><text x="20" y="30" font-family="sans-serif" font-size="16" fill="#1d2130" font-weight="600">Load everything</text><text x="400" y="30" font-family="sans-serif" font-size="16" fill="#1d2130" font-weight="600">Stream in batches</text><text x="20" y="58" font-family="sans-serif" font-size="13" fill="#8b91a1">memory holds every batch at once</text><rect x="20" y="70" width="170" height="220" rx="8" fill="none" stroke="#7c5cf0" stroke-width="2" stroke-dasharray="6 4"/><rect x="35" y="82" width="140" height="26" rx="5" fill="#7c5cf0"/><text x="105.0" y="100.0" font-family="sans-serif" font-size="13" fill="#fff" text-anchor="middle">batch 1</text><rect x="35" y="116" width="140" height="26" rx="5" fill="#7c5cf0"/><text x="105.0" y="134.0" font-family="sans-serif" font-size="13" fill="#fff" text-anchor="middle">batch 2</text><rect x="35" y="150" width="140" height="26" rx="5" fill="#7c5cf0"/><text x="105.0" y="168.0" font-family="sans-serif" font-size="13" fill="#fff" text-anchor="middle">batch 3</text><rect x="35" y="184" width="140" height="26" rx="5" fill="#7c5cf0"/><text x="105.0" y="202.0" font-family="sans-serif" font-size="13" fill="#fff" text-anchor="middle">batch 4</text><rect x="35" y="218" width="140" height="26" rx="5" fill="#7c5cf0"/><text x="105.0" y="236.0" font-family="sans-serif" font-size="13" fill="#fff" text-anchor="middle">batch 5</text><rect x="35" y="252" width="140" height="26" rx="5" fill="#7c5cf0"/><text x="105.0" y="270.0" font-family="sans-serif" font-size="13" fill="#fff" text-anchor="middle">batch 6</text><line x1="195" y1="180" x2="265" y2="180" stroke="#8b91a1" stroke-width="2" marker-end="url(#arrow)"/><rect x="270" y="150" width="100" height="60" rx="5" fill="#1d2130"/><text x="320.0" y="185.0" font-family="sans-serif" font-size="13" fill="#fff" text-anchor="middle">file</text><text x="20" y="312" font-family="sans-serif" font-size="13" fill="#7c5cf0" font-weight="600">memory grows with the library</text><text x="400" y="58" font-family="sans-serif" font-size="13" fill="#8b91a1">memory holds one batch</text><rect x="400" y="150" width="130" height="60" rx="8" fill="none" stroke="#0e9fb5" stroke-width="2" stroke-dasharray="6 4"/><rect x="412" y="167" width="106" height="26" rx="5" fill="#0e9fb5"/><text x="465.0" y="185.0" font-family="sans-serif" font-size="13" fill="#fff" text-anchor="middle">batch k</text><rect x="420" y="80" width="20" height="26" rx="5" fill="#d5eef2"/><rect x="446" y="80" width="20" height="26" rx="5" fill="#d5eef2"/><rect x="472" y="80" width="20" height="26" rx="5" fill="#d5eef2"/><rect x="498" y="80" width="20" height="26" rx="5" fill="#d5eef2"/><text x="530" y="92" font-family="sans-serif" font-size="12" fill="#8b91a1">batches still to come</text><text x="530" y="108" font-family="sans-serif" font-size="12" fill="#8b91a1">(not made yet)</text><line x1="465" y1="110" x2="465" y2="146" stroke="#8b91a1" stroke-width="2" marker-end="url(#arrow)"/><line x1="535" y1="180" x2="605" y2="180" stroke="#8b91a1" stroke-width="2" marker-end="url(#arrow)"/><text x="540" y="170" font-family="sans-serif" font-size="12" fill="#8b91a1">process,</text><text x="540" y="200" font-family="sans-serif" font-size="12" fill="#8b91a1">write</text><rect x="610" y="130" width="100" height="100" rx="5" fill="#1d2130"/><rect x="620" y="138" width="80" height="12" rx="2" fill="#0e9fb5"/><rect x="620" y="156" width="80" height="12" rx="2" fill="#0e9fb5"/><rect x="620" y="174" width="80" height="12" rx="2" fill="#0e9fb5"/><rect x="620" y="192" width="80" height="12" rx="2" fill="#3a3f52"/><rect x="620" y="210" width="80" height="12" rx="2" fill="#3a3f52"/><text x="610" y="250" font-family="sans-serif" font-size="12" fill="#8b91a1">file: one row</text><text x="610" y="266" font-family="sans-serif" font-size="12" fill="#8b91a1">group per batch</text><text x="400" y="312" font-family="sans-serif" font-size="13" fill="#0e9fb5" font-weight="600">memory stays flat, whatever the total</text></svg>