<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300"><rect width="760" height="300" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8b91a1"/></marker></defs><rect x="30" y="60" width="150" height="100" rx="10" fill="#ffffff" stroke="#7c5cf0" stroke-width="2.5"/><text x="105" y="92" font-family="sans-serif" font-size="17" font-weight="600" fill="#1d2130" text-anchor="middle">Run</text><text x="105" y="118" font-family="sans-serif" font-size="11.5" fill="#1d2130" text-anchor="middle">steps: validate, dedupe,</text><text x="105" y="136" font-family="sans-serif" font-size="11.5" fill="#1d2130" text-anchor="middle">enrich, describe, publish</text><line x1="182" y1="110" x2="213" y2="110" stroke="#8b91a1" stroke-width="2" marker-end="url(#arrow)"/><rect x="215" y="60" width="150" height="100" rx="10" fill="#ffffff" stroke="#0e9fb5" stroke-width="2.5"/><text x="290" y="92" font-family="sans-serif" font-size="17" font-weight="600" fill="#1d2130" text-anchor="middle">Record</text><text x="290" y="118" font-family="sans-serif" font-size="11.5" fill="#1d2130" text-anchor="middle">JSON log lines; run and</text><text x="290" y="136" font-family="sans-serif" font-size="11.5" fill="#1d2130" text-anchor="middle">step rows in DuckDB</text><line x1="367" y1="110" x2="398" y2="110" stroke="#8b91a1" stroke-width="2" marker-end="url(#arrow)"/><rect x="400" y="60" width="150" height="100" rx="10" fill="#ffffff" stroke="#7c5cf0" stroke-width="2.5"/><text x="475" y="92" font-family="sans-serif" font-size="17" font-weight="600" fill="#1d2130" text-anchor="middle">Check</text><text x="475" y="118" font-family="sans-serif" font-size="11.5" fill="#1d2130" text-anchor="middle">reconcile; freshness;</text><text x="475" y="136" font-family="sans-serif" font-size="11.5" fill="#1d2130" text-anchor="middle">quarantine rate; drift</text><line x1="552" y1="110" x2="583" y2="110" stroke="#8b91a1" stroke-width="2" marker-end="url(#arrow)"/><rect x="585" y="60" width="150" height="100" rx="10" fill="#ffffff" stroke="#0e9fb5" stroke-width="2.5"/><text x="660" y="92" font-family="sans-serif" font-size="17" font-weight="600" fill="#1d2130" text-anchor="middle">Alert</text><text x="660" y="118" font-family="sans-serif" font-size="11.5" fill="#1d2130" text-anchor="middle">page or ticket, once</text><text x="660" y="136" font-family="sans-serif" font-size="11.5" fill="#1d2130" text-anchor="middle">when a rule starts or stops</text><path d="M660,162 L660,240 L105,240 L105,166" fill="none" stroke="#8b91a1" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="382" y="262" font-family="sans-serif" font-size="13" fill="#1d2130" text-anchor="middle">a person investigates, fixes the cause, and the next run is checked again</text><text x="380" y="34" font-family="sans-serif" font-size="13" fill="#8b91a1" text-anchor="middle">every night, for every run: did it run, did it do the right thing, is the data what we expect?</text></svg>