<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 470" width="860" height="470"><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1d2130"/></marker></defs><rect width="860" height="470" fill="#ffffff"/><rect x="30" y="30" width="220" height="60" rx="10" fill="#eef0f5" stroke="#8b91a1" stroke-width="1.5"/><text x="140.0" y="56.0" font-family="sans-serif" font-size="14" font-weight="600" fill="#1d2130" text-anchor="middle">Incoming records</text><text x="140.0" y="74.0" font-family="sans-serif" font-size="14" font-weight="400" fill="#1d2130" text-anchor="middle">10,083 SMILES</text><rect x="30" y="150" width="220" height="80" rx="10" fill="#f1edfe" stroke="#7c5cf0" stroke-width="1.5"/><text x="140.0" y="177.0" font-family="sans-serif" font-size="14" font-weight="600" fill="#1d2130" text-anchor="middle">1. Read and sanitise</text><text x="140.0" y="195.0" font-family="sans-serif" font-size="14" font-weight="400" fill="#1d2130" text-anchor="middle">MolFromSmiles(sanitize=False)</text><text x="140.0" y="213.0" font-family="sans-serif" font-size="14" font-weight="400" fill="#1d2130" text-anchor="middle">DetectChemistryProblems</text><rect x="30" y="300" width="220" height="120" rx="10" fill="#f1edfe" stroke="#7c5cf0" stroke-width="1.5"/><text x="140.0" y="338.0" font-family="sans-serif" font-size="14" font-weight="600" fill="#1d2130" text-anchor="middle">2. Check the molecule</text><text x="140.0" y="356.0" font-family="sans-serif" font-size="14" font-weight="400" fill="#1d2130" text-anchor="middle">elements (allow-list)</text><text x="140.0" y="374.0" font-family="sans-serif" font-size="14" font-weight="400" fill="#1d2130" text-anchor="middle">fragments, net charge</text><text x="140.0" y="392.0" font-family="sans-serif" font-size="14" font-weight="400" fill="#1d2130" text-anchor="middle">stereo (warn), size</text><rect x="560" y="150" width="270" height="100" rx="10" fill="#f1edfe" stroke="#7c5cf0" stroke-width="1.5"/><text x="695.0" y="187.0" font-family="sans-serif" font-size="14" font-weight="600" fill="#1d2130" text-anchor="middle">Quarantine</text><text x="695.0" y="205.0" font-family="sans-serif" font-size="14" font-weight="400" fill="#1d2130" text-anchor="middle">417 records</text><text x="695.0" y="223.0" font-family="sans-serif" font-size="14" font-weight="400" fill="#1d2130" text-anchor="middle">every issue: code, message, action</text><rect x="560" y="330" width="270" height="80" rx="10" fill="#e6f6f8" stroke="#0e9fb5" stroke-width="1.5"/><text x="695.0" y="357.0" font-family="sans-serif" font-size="14" font-weight="600" fill="#1d2130" text-anchor="middle">Accept</text><text x="695.0" y="375.0" font-family="sans-serif" font-size="14" font-weight="400" fill="#1d2130" text-anchor="middle">9,666 records</text><text x="695.0" y="393.0" font-family="sans-serif" font-size="14" font-weight="400" fill="#1d2130" text-anchor="middle">warnings stored with the record</text><rect x="560" y="30" width="125" height="70" rx="10" fill="#ffffff" stroke="#7c5cf0" stroke-width="1.5"/><text x="622.5" y="61.0" font-family="sans-serif" font-size="14" font-weight="600" fill="#1d2130" text-anchor="middle">Reject</text><text x="622.5" y="79.0" font-family="sans-serif" font-size="14" font-weight="400" fill="#1d2130" text-anchor="middle">249 records</text><rect x="705" y="30" width="125" height="70" rx="10" fill="#ffffff" stroke="#0e9fb5" stroke-width="1.5"/><text x="767.5" y="61.0" font-family="sans-serif" font-size="14" font-weight="600" fill="#1d2130" text-anchor="middle">Fix: Module 7</text><text x="767.5" y="79.0" font-family="sans-serif" font-size="14" font-weight="400" fill="#1d2130" text-anchor="middle">168 records</text><line x1="140" y1="90" x2="140" y2="148" stroke="#1d2130" stroke-width="1.5" marker-end="url(#head)"/><line x1="140" y1="230" x2="140" y2="298" stroke="#1d2130" stroke-width="1.5" marker-end="url(#head)"/><text x="148.0" y="256.0" font-family="sans-serif" font-size="13" fill="#8b91a1">readable</text><line x1="250" y1="190" x2="558" y2="190" stroke="#1d2130" stroke-width="1.5" marker-end="url(#head)"/><text x="300" y="180" font-family="sans-serif" font-size="13" fill="#8b91a1">cannot be read (166)</text><line x1="250" y1="320" x2="558" y2="235" stroke="#1d2130" stroke-width="1.5" marker-end="url(#head)"/><text x="310" y="330" font-family="sans-serif" font-size="13" fill="#8b91a1">any reject or fix issue</text><line x1="250" y1="370" x2="558" y2="370" stroke="#1d2130" stroke-width="1.5" marker-end="url(#head)"/><text x="300" y="360" font-family="sans-serif" font-size="13" fill="#8b91a1">no issues, or warnings only</text><line x1="640" y1="150" x2="625" y2="102" stroke="#1d2130" stroke-width="1.5" marker-end="url(#head)"/><line x1="750" y1="150" x2="765" y2="102" stroke="#1d2130" stroke-width="1.5" marker-end="url(#head)"/><text x="30" y="456" font-family="sans-serif" font-size="13" fill="#8b91a1">Nothing leaves the gate without a verdict: accepted + quarantined = 10,083</text></svg>