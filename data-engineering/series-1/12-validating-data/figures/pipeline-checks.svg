<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360"><rect width="900" height="360" fill="#ffffff"/><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8b91a1"/></marker></defs><text x="20" y="30" font-family="sans-serif" font-size="14" font-weight="600" fill="#7c5cf0">At the edges: one record at a time</text><text x="470" y="30" font-family="sans-serif" font-size="14" font-weight="600" fill="#0e9fb5">In the middle: whole tables</text><line x1="445" y1="16" x2="445" y2="344" stroke="#d9dbe3" stroke-dasharray="5,5"/><rect x="20" y="60" width="130" height="60" rx="8" fill="#f1f2f6"/><text x="85.0" y="86.0" font-family="sans-serif" font-size="13" font-weight="600" fill="#1d2130" text-anchor="middle">API response</text><text x="85.0" y="104.0" font-family="sans-serif" font-size="13" font-weight="400" fill="#1d2130" text-anchor="middle">(Module 11)</text><line x1="150" y1="90" x2="208" y2="150" stroke="#8b91a1" stroke-width="2" marker-end="url(#head)"/><rect x="20" y="150" width="130" height="60" rx="8" fill="#f1f2f6"/><text x="85.0" y="185.0" font-family="sans-serif" font-size="13" font-weight="600" fill="#1d2130" text-anchor="middle">form entry</text><line x1="150" y1="180" x2="208" y2="180" stroke="#8b91a1" stroke-width="2" marker-end="url(#head)"/><rect x="20" y="240" width="130" height="60" rx="8" fill="#f1f2f6"/><text x="85.0" y="275.0" font-family="sans-serif" font-size="13" font-weight="600" fill="#1d2130" text-anchor="middle">instrument file</text><line x1="150" y1="270" x2="208" y2="210" stroke="#8b91a1" stroke-width="2" marker-end="url(#head)"/><rect x="210" y="120" width="200" height="120" rx="8" fill="#ece7fd"/><text x="310.0" y="158.0" font-family="sans-serif" font-size="13" font-weight="600" fill="#1d2130" text-anchor="middle">Pydantic model</text><text x="310.0" y="176.0" font-family="sans-serif" font-size="13" font-weight="400" fill="#1d2130" text-anchor="middle">checks each record:</text><text x="310.0" y="194.0" font-family="sans-serif" font-size="13" font-weight="400" fill="#1d2130" text-anchor="middle">a typed object, or</text><text x="310.0" y="212.0" font-family="sans-serif" font-size="13" font-weight="400" fill="#1d2130" text-anchor="middle">an error per field</text><line x1="410" y1="180" x2="466" y2="180" stroke="#8b91a1" stroke-width="2" marker-end="url(#head)"/><rect x="468" y="130" width="150" height="100" rx="8" fill="#e0f4f7"/><text x="543.0" y="158.0" font-family="sans-serif" font-size="13" font-weight="600" fill="#1d2130" text-anchor="middle">Pandera schema</text><text x="543.0" y="176.0" font-family="sans-serif" font-size="13" font-weight="400" fill="#1d2130" text-anchor="middle">whole batch, lazy:</text><text x="543.0" y="194.0" font-family="sans-serif" font-size="13" font-weight="400" fill="#1d2130" text-anchor="middle">every failure</text><text x="543.0" y="212.0" font-family="sans-serif" font-size="13" font-weight="400" fill="#1d2130" text-anchor="middle">in one report</text><line x1="618" y1="160" x2="688" y2="95" stroke="#8b91a1" stroke-width="2" marker-end="url(#head)"/><line x1="618" y1="180" x2="688" y2="180" stroke="#8b91a1" stroke-width="2" marker-end="url(#head)"/><line x1="618" y1="200" x2="688" y2="265" stroke="#8b91a1" stroke-width="2" marker-end="url(#head)"/><rect x="690" y="60" width="190" height="64" rx="8" fill="#f1f2f6"/><text x="785.0" y="88.0" font-family="sans-serif" font-size="13" font-weight="600" fill="#1d2130" text-anchor="middle">kept rows</text><text x="785.0" y="106.0" font-family="sans-serif" font-size="13" font-weight="400" fill="#1d2130" text-anchor="middle">loaded into the database</text><rect x="690" y="148" width="190" height="64" rx="8" fill="#f1f2f6"/><text x="785.0" y="176.0" font-family="sans-serif" font-size="13" font-weight="600" fill="#1d2130" text-anchor="middle">failing rows + reasons</text><text x="785.0" y="194.0" font-family="sans-serif" font-size="13" font-weight="400" fill="#1d2130" text-anchor="middle">quarantine table</text><rect x="690" y="236" width="190" height="64" rx="8" fill="#f1f2f6"/><text x="785.0" y="264.0" font-family="sans-serif" font-size="13" font-weight="600" fill="#1d2130" text-anchor="middle">batch decision</text><text x="785.0" y="282.0" font-family="sans-serif" font-size="13" font-weight="400" fill="#1d2130" text-anchor="middle">load, or stop if too many fail</text><text x="20" y="346" font-family="sans-serif" font-size="12" fill="#8b91a1">Both check the same written contract (measurements 1.0.0).</text></svg>