t-family="sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="normal">50</text><rect x="642" y="276" width="46" height="40" rx="4" fill="#7c5cf0"/><text x="665.0" y="301.0" font-family="sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="normal">60</text><text x="702" y="302" font-family="sans-serif" font-size="12" fill="#1d2130" text-anchor="start" font-weight="normal">no repeat</text><text x="16" y="352" font-family="sans-serif" font-size="13" fill="#1d2130" text-anchor="start" font-weight="normal">Offset counts positions, so an insertion before the offset repeats a record and a deletion skips one.</text><text x="16" y="374" font-family="sans-serif" font-size="13" fill="#1d2130" text-anchor="start" font-weight="normal">Asking for keys above the last one seen does not depend on positions; the high-water mark uses the same idea between runs.</text></svg>