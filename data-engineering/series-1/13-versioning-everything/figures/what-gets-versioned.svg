<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430"><rect width="900" height="430" fill="#ffffff"/><defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8b91a1"/></marker></defs><text x="20" y="30" font-family="sans-serif" font-size="14" fill="#7c5cf0">In the git repository: one commit pins all of these</text><rect x="20" y="44" width="560" height="250" rx="12" fill="none" stroke="#7c5cf0" stroke-width="2" stroke-dasharray="6,4"/><rect x="36" y="64" width="172" height="70" rx="8" fill="#ece7fd"/><text x="122.0" y="95.0" font-family="sans-serif" font-size="13" font-weight="600" fill="#1d2130" text-anchor="middle">code</text><text x="122.0" y="113.0" font-family="sans-serif" font-size="13" font-weight="400" fill="#1d2130" text-anchor="middle">commit + tag v1.0.0</text><rect x="214" y="64" width="172" height="70" rx="8" fill="#ece7fd"/><text x="300.0" y="95.0" font-family="sans-serif" font-size="13" font-weight="600" fill="#1d2130" text-anchor="middle">environment</text><text x="300.0" y="113.0" font-family="sans-serif" font-size="13" font-weight="400" fill="#1d2130" text-anchor="middle">pyproject.toml + uv.lock</text><rect x="392" y="64" width="172" height="70" rx="8" fill="#ece7fd"/><text x="478.0" y="95.0" font-family="sans-serif" font-size="13" font-weight="600" fill="#1d2130" text-anchor="middle">data pointers</text><text x="478.0" y="113.0" font-family="sans-serif" font-size="13" font-weight="400" fill="#1d2130" text-anchor="middle">.dvc files: md5 + size</text><rect x="36" y="164" width="172" height="70" rx="8" fill="#ece7fd"/><text x="122.0" y="195.0" font-family="sans-serif" font-size="13" font-weight="600" fill="#1d2130" text-anchor="middle">standardisation rules</text><text x="122.0" y="213.0" font-family="sans-serif" font-size="13" font-weight="400" fill="#1d2130" text-anchor="middle">version + SHA-256</text><rect x="214" y="164" width="172" height="70" rx="8" fill="#ece7fd"/><text x="300.0" y="195.0" font-family="sans-serif" font-size="13" font-weight="600" fill="#1d2130" text-anchor="middle">container recipe</text><text x="300.0" y="213.0" font-family="sans-serif" font-size="13" font-weight="400" fill="#1d2130" text-anchor="middle">Dockerfile, base @sha256</text><rect x="392" y="164" width="172" height="70" rx="8" fill="#ece7fd"/><text x="478.0" y="195.0" font-family="sans-serif" font-size="13" font-weight="600" fill="#1d2130" text-anchor="middle">database schema</text><text x="478.0" y="213.0" font-family="sans-serif" font-size="13" font-weight="400" fill="#1d2130" text-anchor="middle">numbered .sql files</text><text x="40" y="270" font-family="sans-serif" font-size="12" fill="#8b91a1">git describe names it: v1.0.0, v1.0.0-1-g&lt;commit&gt;, -dirty</text><text x="620" y="30" font-family="sans-serif" font-size="14" fill="#0e9fb5">Outside git, named by hash</text><rect x="620" y="60" width="260" height="70" rx="8" fill="#e0f4f7"/><text x="750.0" y="91.0" font-family="sans-serif" font-size="13" font-weight="600" fill="#1d2130" text-anchor="middle">data files</text><text x="750.0" y="109.0" font-family="sans-serif" font-size="13" font-weight="400" fill="#1d2130" text-anchor="middle">DVC cache and remote (S3, ...)</text><rect x="620" y="150" width="260" height="70" rx="8" fill="#e0f4f7"/><text x="750.0" y="181.0" font-family="sans-serif" font-size="13" font-weight="600" fill="#1d2130" text-anchor="middle">database</text><text x="750.0" y="199.0" font-family="sans-serif" font-size="13" font-weight="400" fill="#1d2130" text-anchor="middle">schema_migrations: what was applied</text><rect x="620" y="240" width="260" height="70" rx="8" fill="#e0f4f7"/><text x="750.0" y="271.0" font-family="sans-serif" font-size="13" font-weight="600" fill="#1d2130" text-anchor="middle">container image</text><text x="750.0" y="289.0" font-family="sans-serif" font-size="13" font-weight="400" fill="#1d2130" text-anchor="middle">registry, pulled by digest</text><line x1="564" y1="99" x2="618" y2="95" stroke="#8b91a1" stroke-width="2" marker-end="url(#head)"/><line x1="564" y1="199" x2="618" y2="185" stroke="#8b91a1" stroke-width="2" marker-end="url(#head)"/><line x1="300" y1="236" x2="618" y2="276" stroke="#8b91a1" stroke-width="2" marker-end="url(#head)"/><rect x="250" y="330" width="400" height="76" rx="8" fill="#f1f2f6"/><text x="450.0" y="355.0" font-family="sans-serif" font-size="13" font-weight="600" fill="#1d2130" text-anchor="middle">result + provenance record</text><text x="450.0" y="373.0" font-family="sans-serif" font-size="13" font-weight="400" fill="#1d2130" text-anchor="middle">names the commit, versions, schema, rules hash,</text><text x="450.0" y="391.0" font-family="sans-serif" font-size="13" font-weight="400" fill="#1d2130" text-anchor="middle">input hashes and parameters</text><line x1="300" y1="296" x2="340" y2="328" stroke="#8b91a1" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#head)"/><line x1="750" y1="312" x2="610" y2="330" stroke="#8b91a1" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#head)"/><text x="20" y="422" font-family="sans-serif" font-size="12" fill="#8b91a1">Dashed: the record refers to them, so the result can be traced back and rebuilt.</text></svg>