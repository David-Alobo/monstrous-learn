<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="920" height="420"><rect width="920" height="420" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8b91a1"/></marker></defs><rect x="373" y="30" width="534" height="112" rx="12" fill="none" stroke="#0e9fb5" stroke-width="1.5" stroke-dasharray="7 5"/><text x="383" y="46" font-family="sans-serif" font-size="11.5" fill="#0e9fb5">worker processes: several batches at once (pure functions)</text><rect x="13" y="176" width="714" height="112" rx="12" fill="none" stroke="#7c5cf0" stroke-width="1.5" stroke-dasharray="7 5"/><text x="113" y="192" font-family="sans-serif" font-size="11.5" fill="#7c5cf0">main process: one batch at a time, in batch order</text><rect x="25" y="56" width="150" height="64" rx="9" fill="#ffffff" stroke="#8b91a1" stroke-width="2.2"/><text x="100" y="77" font-family="sans-serif" font-size="14" font-weight="600" fill="#1d2130" text-anchor="middle">Library</text><text x="100" y="95" font-family="sans-serif" font-size="10.5" fill="#1d2130" text-anchor="middle">chemlib: a sample, or</text><text x="100" y="110" font-family="sans-serif" font-size="10.5" fill="#1d2130" text-anchor="middle">the whole 1.7 million</text><line x1="177" y1="88" x2="203" y2="88" stroke="#8b91a1" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="205" y="56" width="150" height="64" rx="9" fill="#ffffff" stroke="#8b91a1" stroke-width="2.2"/><text x="280" y="77" font-family="sans-serif" font-size="14" font-weight="600" fill="#1d2130" text-anchor="middle">Ingest</text><text x="280" y="95" font-family="sans-serif" font-size="10.5" fill="#1d2130" text-anchor="middle">one batch at a time;</text><text x="280" y="110" font-family="sans-serif" font-size="10.5" fill="#1d2130" text-anchor="middle">retries (tenacity)</text><line x1="357" y1="88" x2="383" y2="88" stroke="#8b91a1" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="385" y="56" width="150" height="64" rx="9" fill="#ffffff" stroke="#0e9fb5" stroke-width="2.2"/><text x="460" y="77" font-family="sans-serif" font-size="14" font-weight="600" fill="#1d2130" text-anchor="middle">Validate</text><text x="460" y="95" font-family="sans-serif" font-size="10.5" fill="#1d2130" text-anchor="middle">PARSE, VALENCE</text><text x="460" y="110" font-family="sans-serif" font-size="10.5" fill="#1d2130" text-anchor="middle">→ quarantine</text><line x1="537" y1="88" x2="563" y2="88" stroke="#8b91a1" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="565" y="56" width="150" height="64" rx="9" fill="#ffffff" stroke="#0e9fb5" stroke-width="2.2"/><text x="640" y="77" font-family="sans-serif" font-size="14" font-weight="600" fill="#1d2130" text-anchor="middle">Standardise</text><text x="640" y="95" font-family="sans-serif" font-size="10.5" fill="#1d2130" text-anchor="middle">parent, uncharge;</text><text x="640" y="110" font-family="sans-serif" font-size="10.5" fill="#1d2130" text-anchor="middle">ELEMENT → quarantine</text><line x1="717" y1="88" x2="743" y2="88" stroke="#8b91a1" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="745" y="56" width="150" height="64" rx="9" fill="#ffffff" stroke="#0e9fb5" stroke-width="2.2"/><text x="820" y="77" font-family="sans-serif" font-size="14" font-weight="600" fill="#1d2130" text-anchor="middle">Describe, flag</text><text x="820" y="95" font-family="sans-serif" font-size="10.5" fill="#1d2130" text-anchor="middle">InChIKey, Morgan,</text><text x="820" y="110" font-family="sans-serif" font-size="10.5" fill="#1d2130" text-anchor="middle">descriptors, PAINS</text><rect x="25" y="202" width="150" height="64" rx="9" fill="#ffffff" stroke="#7c5cf0" stroke-width="2.2"/><text x="100" y="223" font-family="sans-serif" font-size="14" font-weight="600" fill="#1d2130" text-anchor="middle">Deduplicate</text><text x="100" y="241" font-family="sans-serif" font-size="10.5" fill="#1d2130" text-anchor="middle">first InChIKey wins,</text><text x="100" y="256" font-family="sans-serif" font-size="10.5" fill="#1d2130" text-anchor="middle">across all batches</text><line x1="177" y1="234" x2="203" y2="234" stroke="#8b91a1" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="205" y="202" width="150" height="64" rx="9" fill="#ffffff" stroke="#7c5cf0" stroke-width="2.2"/><text x="280" y="223" font-family="sans-serif" font-size="14" font-weight="600" fill="#1d2130" text-anchor="middle">Filter</text><text x="280" y="241" font-family="sans-serif" font-size="10.5" fill="#1d2130" text-anchor="middle">PAINS, MW, logP</text><text x="280" y="256" font-family="sans-serif" font-size="10.5" fill="#1d2130" text-anchor="middle">→ removed, with reason</text><line x1="357" y1="234" x2="383" y2="234" stroke="#8b91a1" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="385" y="202" width="150" height="64" rx="9" fill="#ffffff" stroke="#7c5cf0" stroke-width="2.2"/><text x="460" y="223" font-family="sans-serif" font-size="14" font-weight="600" fill="#1d2130" text-anchor="middle">Write</text><text x="460" y="241" font-family="sans-serif" font-size="10.5" fill="#1d2130" text-anchor="middle">Parquet, atomic:</text><text x="460" y="256" font-family="sans-serif" font-size="10.5" fill="#1d2130" text-anchor="middle">temporary file, rename</text><line x1="537" y1="234" x2="563" y2="234" stroke="#8b91a1" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="565" y="202" width="150" height="64" rx="9" fill="#ffffff" stroke="#7c5cf0" stroke-width="2.2"/><text x="640" y="223" font-family="sans-serif" font-size="14" font-weight="600" fill="#1d2130" text-anchor="middle">Checkpoint</text><text x="640" y="241" font-family="sans-serif" font-size="10.5" fill="#1d2130" text-anchor="middle">batch + InChIKeys,</text><text x="640" y="256" font-family="sans-serif" font-size="10.5" fill="#1d2130" text-anchor="middle">one transaction</text><line x1="717" y1="234" x2="743" y2="234" stroke="#8b91a1" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="745" y="202" width="150" height="64" rx="9" fill="#ffffff" stroke="#1d2130" stroke-width="2.2"/><text x="820" y="223" font-family="sans-serif" font-size="14" font-weight="600" fill="#1d2130" text-anchor="middle">Finish</text><text x="820" y="241" font-family="sans-serif" font-size="10.5" fill="#1d2130" text-anchor="middle">reconcile counts;</text><text x="820" y="256" font-family="sans-serif" font-size="10.5" fill="#1d2130" text-anchor="middle">views; manifest</text><path d="M820,121 L820,158 L100,158 L100,198" fill="none" stroke="#8b91a1" stroke-width="1.8" marker-end="url(#arrow)"/><text x="820" y="192" font-family="sans-serif" font-size="10.5" fill="#8b91a1" text-anchor="middle">after the last batch</text><rect x="65" y="330" width="150" height="70" rx="4" fill="#f1f2f6" stroke="#8b91a1" stroke-width="1"/><text x="140" y="352" font-family="sans-serif" font-size="11" fill="#1d2130" text-anchor="middle">Parquet: compounds,</text><text x="140" y="368" font-family="sans-serif" font-size="11" fill="#1d2130" text-anchor="middle">quarantine, removed</text><text x="140" y="384" font-family="sans-serif" font-size="11" fill="#1d2130" text-anchor="middle">(batch=NNNNN partitions)</text><rect x="325" y="330" width="150" height="70" rx="4" fill="#f1f2f6" stroke="#8b91a1" stroke-width="1"/><text x="400" y="352" font-family="sans-serif" font-size="11" fill="#1d2130" text-anchor="middle">DuckDB: runs, batches,</text><text x="400" y="368" font-family="sans-serif" font-size="11" fill="#1d2130" text-anchor="middle">seen InChIKeys, and</text><text x="400" y="384" font-family="sans-serif" font-size="11" fill="#1d2130" text-anchor="middle">views over the Parquet</text><rect x="555" y="330" width="150" height="70" rx="4" fill="#f1f2f6" stroke="#8b91a1" stroke-width="1"/><text x="630" y="352" font-family="sans-serif" font-size="11" fill="#1d2130" text-anchor="middle">manifest.json: input,</text><text x="630" y="368" font-family="sans-serif" font-size="11" fill="#1d2130" text-anchor="middle">rules + hash, versions,</text><text x="630" y="384" font-family="sans-serif" font-size="11" fill="#1d2130" text-anchor="middle">counts, file hashes</text><rect x="765" y="330" width="150" height="70" rx="4" fill="#f1f2f6" stroke="#8b91a1" stroke-width="1"/><text x="840" y="352" font-family="sans-serif" font-size="11" fill="#1d2130" text-anchor="middle">pipeline.log:</text><text x="840" y="368" font-family="sans-serif" font-size="11" fill="#1d2130" text-anchor="middle">one JSON event</text><text x="840" y="384" font-family="sans-serif" font-size="11" fill="#1d2130" text-anchor="middle">per line</text><line x1="460" y1="266" x2="140" y2="328" stroke="#8b91a1" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrow)"/><line x1="640" y1="266" x2="400" y2="328" stroke="#8b91a1" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrow)"/><line x1="805" y1="266" x2="630" y2="328" stroke="#8b91a1" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrow)"/><line x1="845" y1="266" x2="840" y2="328" stroke="#8b91a1" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#arrow)"/></svg>