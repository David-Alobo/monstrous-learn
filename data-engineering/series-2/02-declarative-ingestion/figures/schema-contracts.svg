 font-weight="normal">loaded</text><path d="M290 235 Q300.0 235.0 301.0 235.0" fill="none" stroke="#8b91a1" stroke-width="2"/><path d="M310 235 L301.0 240.0 L301.0 230.0 z" fill="#8b91a1"/><rect x="450" y="200" width="120" height="70" rx="10" fill="#e6f5f0" stroke="#009E73" stroke-width="2"/><text x="510.0" y="231.0" font-family="sans-serif" font-size="13" fill="#1d2130" text-anchor="middle" font-weight="600">week 4</text><text x="510.0" y="247.0" font-family="sans-serif" font-size="12" fill="#5b6170" text-anchor="middle" font-weight="normal">loaded</text><path d="M430 235 Q440.0 235.0 441.0 235.0" fill="none" stroke="#8b91a1" stroke-width="2"/><path d="M450 235 L441.0 240.0 L441.0 230.0 z" fill="#8b91a1"/><rect x="590" y="200" width="120" height="70" rx="10" fill="#fbe9e1" stroke="#D55E00" stroke-width="2"/><text x="650.0" y="223.0" font-family="sans-serif" font-size="13" fill="#1d2130" text-anchor="middle" font-weight="600">week 5</text><text x="650.0" y="239.0" font-family="sans-serif" font-size="12" fill="#5b6170" text-anchor="middle" font-weight="normal">stops at normalize</text><text x="650.0" y="255.0" font-family="sans-serif" font-size="12" fill="#5b6170" text-anchor="middle" font-weight="normal">&#x27;unit&#x27; not allowed</text><path d="M570 235 Q580.0 235.0 581.0 235.0" fill="none" stroke="#8b91a1" stroke-width="2"/><path d="M590 235 L581.0 240.0 L581.0 230.0 z" fill="#8b91a1"/><rect x="730" y="200" width="120" height="70" rx="10" fill="#f2f3f5" stroke="#8b91a1" stroke-width="2" stroke-dasharray="5 3"/><text x="790.0" y="231.0" font-family="sans-serif" font-size="13" fill="#8b91a1" text-anchor="middle" font-weight="600">week 6</text><text x="790.0" y="247.0" font-family="sans-serif" font-size="12" fill="#8b91a1" text-anchor="middle" font-weight="normal">waits for a decision</text><path d="M710 235 Q720.0 235.0 721.0 235.0" fill="none" stroke="#8b91a1" stroke-width="2"/><path d="M730 235 L721.0 240.0 L721.0 230.0 z" fill="#8b91a1"/><text x="170" y="175" font-family="sans-serif" font-size="12" fill="#8b91a1" text-anchor="start" font-weight="normal">Nothing stops: raw holds &#x27;units&#x27; for weeks 1-4 and &#x27;unit&#x27; from week 5; staging joins them (coalesce).</text><text x="170" y="305" font-family="sans-serif" font-size="12" fill="#8b91a1" text-anchor="start" font-weight="normal">abort_packages() puts the state back to week 4; a person decides; the next run allows the new columns once and loads weeks 5 and 6.</text></svg>