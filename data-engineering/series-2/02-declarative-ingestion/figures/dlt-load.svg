<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 440" width="1000" height="440"><rect width="1000" height="440" fill="#ffffff"/><text x="20" y="30" font-family="sans-serif" font-size="16" fill="#1d2130" text-anchor="start" font-weight="600">One dlt load: what you declare, and what dlt does</text><rect x="20" y="70" width="170" height="230" rx="10" fill="#ffffff" stroke="#8b91a1" stroke-width="2" stroke-dasharray="5 3"/><text x="105.0" y="133.0" font-family="sans-serif" font-size="14" fill="#1d2130" text-anchor="middle" font-weight="600">inbox</text><text x="105.0" y="149.0" font-family="sans-serif" font-size="12" fill="#5b6170" text-anchor="middle" font-weight="normal">registry_…10-12</text><text x="105.0" y="165.0" font-family="sans-serif" font-size="12" fill="#5b6170" text-anchor="middle" font-weight="normal">assay_…09-14</text><text x="105.0" y="181.0" font-family="sans-serif" font-size="12" fill="#5b6170" text-anchor="middle" font-weight="normal">assay_…09-21</text><text x="105.0" y="197.0" font-family="sans-serif" font-size="12" fill="#5b6170" text-anchor="middle" font-weight="normal">assay_…09-21_resent</text><text x="105.0" y="213.0" font-family="sans-serif" font-size="12" fill="#5b6170" text-anchor="middle" font-weight="normal">assay_…09-28</text><text x="105.0" y="229.0" font-family="sans-serif" font-size="12" fill="#5b6170" text-anchor="middle" font-weight="normal">assay_…10-05</text><text x="105.0" y="245.0" font-family="sans-serif" font-size="12" fill="#5b6170" text-anchor="middle" font-weight="normal">assay_…10-12</text><text x="205" y="66" font-family="sans-serif" font-size="12" fill="#7c5cf0" text-anchor="start" font-weight="600">what you declare</text><rect x="215" y="80" width="180" height="80" rx="10" fill="#ffffff" stroke="#0e9fb5" stroke-width="2"/><text x="305.0" y="108.0" font-family="sans-serif" font-size="13" fill="#1d2130" text-anchor="middle" font-weight="600">registry resource</text><text x="305.0" y="124.0" font-family="sans-serif" font-size="12" fill="#5b6170" text-anchor="middle" font-weight="normal">write: replace</text><text x="305.0" y="140.0" font-family="sans-serif" font-size="12" fill="#5b6170" text-anchor="middle" font-weight="normal">(each export is a snapshot)</text><rect x="215" y="190" width="180" height="110" rx="10" fill="#ffffff" stroke="#0e9fb5" stroke-width="2"/><text x="305.0" y="225.0" font-family="sans-serif" font-size="13" fill="#1d2130" text-anchor="middle" font-weight="600">assay resource</text><text x="305.0" y="241.0" font-family="sans-serif" font-size="12" fill="#5b6170" text-anchor="middle" font-weight="normal">incremental on file_name:</text><text x="305.0" y="257.0" font-family="sans-serif" font-size="12" fill="#5b6170" text-anchor="middle" font-weight="normal">only names &gt; last_value</text><text x="305.0" y="273.0" font-family="sans-serif" font-size="12" fill="#5b6170" text-anchor="middle" font-weight="normal">write: merge on result_id</text><path d="M190 120 Q202.5 120.0 206.0 120.0" fill="none" stroke="#8b91a1" stroke-width="2"/><path d="M215 120 L206.0 125.0 L206.0 115.0 z" fill="#8b91a1"/><path d="M190 245 Q202.5 245.0 206.0 245.0" fill="none" stroke="#8b91a1" stroke-width="2"/><path d="M215 245 L206.0 250.0 L206.0 240.0 z" fill="#8b91a1"/><text x="430" y="66" font-family="sans-serif" font-size="12" fill="#7c5cf0" text-anchor="start" font-weight="600">what dlt does, on pipeline.run(...)</text><rect x="430" y="150" width="115" height="70" rx="10" fill="#efeafd" stroke="#7c5cf0" stroke-width="2"/><text x="487.5" y="181.0" font-family="sans-serif" font-size="13" fill="#1d2130" text-anchor="middle" font-weight="600">extract</text><text x="487.5" y="197.0" font-family="sans-serif" font-size="12" fill="#5b6170" text-anchor="middle" font-weight="normal">call the resources</text><rect x="565" y="150" width="115" height="70" rx="10" fill="#efeafd" stroke="#7c5cf0" stroke-width="2"/><text x="622.5" y="181.0" font-family="sans-serif" font-size="13" fill="#1d2130" text-anchor="middle" font-weight="600">normalize</text><text x="622.5" y="197.0" font-family="sans-serif" font-size="12" fill="#5b6170" text-anchor="middle" font-weight="normal">fit rows to schema</text><path d="M545 185 Q555.0 185.0 556.0 185.0" fill="none" stroke="#8b91a1" stroke-width="2"/><path d="M565 185 L556.0 190.0 L556.0 180.0 z" fill="#8b91a1"/><rect x="700" y="150" width="115" height="70" rx="10" fill="#efeafd" stroke="#7c5cf0" stroke-width="2"/><text x="757.5" y="181.0" font-family="sans-serif" font-size="13" fill="#1d2130" text-anchor="middle" font-weight="600">load</text><text x="757.5" y="197.0" font-family="sans-serif" font-size="12" fill="#5b6170" text-anchor="middle" font-weight="normal">write the rows</text><path d="M680 185 Q690.0 185.0 691.0 185.0" fill="none" stroke="#8b91a1" stroke-width="2"/><path d="M700 185 L691.0 190.0 L691.0 180.0 z" fill="#8b91a1"/><path d="M395 185 Q412.5 185.0 421.0 185.0" fill="none" stroke="#8b91a1" stroke-width="2"/><path d="M430 185 L421.0 190.0 L421.0 180.0 z" fill="#8b91a1"/><rect x="510" y="250" width="190" height="60" rx="10" fill="#ffffff" stroke="#8b91a1" stroke-width="2"/><text x="605.0" y="268.0" font-family="sans-serif" font-size="13" fill="#1d2130" text-anchor="middle" font-weight="600">schema</text><text x="605.0" y="284.0" font-family="sans-serif" font-size="12" fill="#5b6170" text-anchor="middle" font-weight="normal">inferred from the data; evolves</text><text x="605.0" y="300.0" font-family="sans-serif" font-size="12" fill="#5b6170" text-anchor="middle" font-weight="normal">unless a contract says not</text><path d="M620 250 Q620.0 235.0 620.0 229.0" fill="none" stroke="#8b91a1" stroke-width="2" stroke-dasharray="5 4"/><path d="M620 220 L625.0 229.0 L615.0 229.0 z" fill="#8b91a1"/><rect x="835" y="140" width="150" height="90" rx="10" fill="#7c5cf0" stroke="#7c5cf0" stroke-width="2"/><text x="910.0" y="173.0" font-family="sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="600">DuckDB: raw</text><text x="910.0" y="189.0" font-family="sans-serif" font-size="12" fill="#ece8fd" text-anchor="middle" font-weight="normal">registry, assay,</text><text x="910.0" y="205.0" font-family="sans-serif" font-size="12" fill="#ece8fd" text-anchor="middle" font-weight="normal">_dlt_loads</text><path d="M815 185 Q825.0 185.0 826.0 185.0" fill="none" stroke="#8b91a1" stroke-width="2"/><path d="M835 185 L826.0 190.0 L826.0 180.0 z" fill="#8b91a1"/><rect x="835" y="260" width="150" height="80" rx="10" fill="#ffffff" stroke="#8b91a1" stroke-width="2"/><text x="910.0" y="288.0" font-family="sans-serif" font-size="13" fill="#1d2130" text-anchor="middle" font-weight="600">state</text><text x="910.0" y="304.0" font-family="sans-serif" font-size="12" fill="#5b6170" text-anchor="middle" font-weight="normal">last_value =</text><text x="910.0" y="320.0" font-family="sans-serif" font-size="12" fill="#5b6170" text-anchor="middle" font-weight="normal">assay_…10-12.csv</text><path d="M910 260 Q910.0 245.0 910.0 239.0" fill="none" stroke="#8b91a1" stroke-width="2" stroke-dasharray="5 4"/><path d="M910 230 L915.0 239.0 L905.0 239.0 z" fill="#8b91a1"/><text x="918" y="250" font-family="sans-serif" font-size="11" fill="#8b91a1" text-anchor="start" font-weight="normal">kept in raw too</text><line x1="910" y1="340" x2="910" y2="375" stroke="#8b91a1" stroke-width="2" stroke-dasharray="4 4"/><line x1="910" y1="375" x2="305" y2="375" stroke="#8b91a1" stroke-width="2" stroke-dasharray="4 4"/><path d="M305 375 Q305.0 337.5 305.0 309.0" fill="none" stroke="#8b91a1" stroke-width="2" stroke-dasharray="5 4"/><path d="M305 300 L310.0 309.0 L300.0 309.0 z" fill="#8b91a1"/><text x="600" y="368" font-family="sans-serif" font-size="12" fill="#8b91a1" text-anchor="middle" font-weight="normal">the next run reads only files after last_value</text><text x="20" y="420" font-family="sans-serif" font-size="12" fill="#8b91a1" text-anchor="start" font-weight="normal">The resent file brings result_ids already in the table: merge keeps one row for each, so nothing is counted twice.</text></svg>