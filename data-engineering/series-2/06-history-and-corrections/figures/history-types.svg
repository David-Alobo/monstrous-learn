serif" font-size="12" fill="#5b6170" text-anchor="middle" font-weight="normal">valid 14 Sep to 19 Oct</text><text x="407.0" y="256.0" font-family="sans-serif" font-size="12" fill="#5b6170" text-anchor="middle" font-weight="normal">O=C(Cc1ccc(O)cc1)Nc2ccc(C#N)nc2</text><rect x="562" y="205" width="372" height="62" rx="10" fill="#7c5cf0" stroke="#7c5cf0" stroke-width="2"/><text x="748.0" y="224.0" font-family="sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">version 2 (current)</text><text x="748.0" y="240.0" font-family="sans-serif" font-size="12" fill="#ece8fd" text-anchor="middle" font-weight="normal">valid from 19 Oct</text><text x="748.0" y="256.0" font-family="sans-serif" font-size="12" fill="#ece8fd" text-anchor="middle" font-weight="normal">O=C(Nc1ccc(O)cc1)Nc2ccc(C#N)nc2</text><circle cx="345.0" cy="300" r="9" fill="#009E73"/><text x="345.0" y="322" font-family="sans-serif" font-size="11" fill="#8b91a1" text-anchor="middle" font-weight="normal">EGFR</text><circle cx="407.0" cy="300" r="9" fill="#009E73"/><text x="407.0" y="322" font-family="sans-serif" font-size="11" fill="#8b91a1" text-anchor="middle" font-weight="normal">panel</text><text x="438" y="304" font-family="sans-serif" font-size="12" fill="#8b91a1" text-anchor="start" font-weight="normal">every measurement of LAB-0042 was made under version 1: only type 2 can say so</text><text x="20" y="375" font-family="sans-serif" font-size="12" fill="#8b91a1" text-anchor="start" font-weight="normal">Registered in week 2 (exported 14 Sep); measured on EGFR in week 3 and on the panel in week 4.</text></svg>