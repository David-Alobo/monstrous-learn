t-size="12" fill="#5b6170" text-anchor="middle" font-weight="normal">raw: as loaded</text><text x="435.0" y="165.0" font-family="sans-serif" font-size="12" fill="#5b6170" text-anchor="middle" font-weight="normal">snapshots: history (M6)</text><text x="435.0" y="181.0" font-family="sans-serif" font-size="12" fill="#5b6170" text-anchor="middle" font-weight="normal">staging and marts:</text><text x="435.0" y="197.0" font-family="sans-serif" font-size="12" fill="#5b6170" text-anchor="middle" font-weight="normal">dbt models (M4)</text><text x="435.0" y="213.0" font-family="sans-serif" font-size="12" fill="#5b6170" text-anchor="middle" font-weight="normal">tests, contracts (M5)</text><text x="435.0" y="229.0" font-family="sans-serif" font-size="12" fill="#5b6170" text-anchor="middle" font-weight="normal">monitoring: metrics,</text><text x="435.0" y="245.0" font-family="sans-serif" font-size="12" fill="#5b6170" text-anchor="middle" font-weight="normal">alerts (M8)</text><rect x="580" y="100" width="120" height="80" rx="10" fill="#ffffff" stroke="#0e9fb5" stroke-width="2"/><text x="640.0" y="128.0" font-family="sans-serif" font-size="13" fill="#1d2130" text-anchor="middle" font-weight="600">checks (M8)</text><text x="640.0" y="144.0" font-family="sans-serif" font-size="12" fill="#5b6170" text-anchor="middle" font-weight="normal">freshness, volume,</text><text x="640.0" y="160.0" font-family="sans-serif" font-size="12" fill="#5b6170" text-anchor="middle" font-weight="normal">schema, drift</text><rect x="580" y="200" width="120" height="80" rx="10" fill="#ffffff" stroke="#0e9fb5" stroke-width="2"/><text x="640.0" y="236.0" font-family="sans-serif" font-size="13" fill="#1d2130" text-anchor="middle" font-weight="600">chemistry (M5)</text><text x="640.0" y="252.0" font-family="sans-serif" font-size="12" fill="#5b6170" text-anchor="middle" font-weight="normal">pandera-chem</text><rect x="730" y="140" width="105" height="80" rx="10" fill="#ffffff" stroke="#0e9fb5" stroke-width="2"/><text x="782.5" y="168.0" font-family="sans-serif" font-size="13" fill="#1d2130" text-anchor="middle" font-weight="600">publish (M10)</text><text x="782.5" y="184.0" font-family="sans-serif" font-size="12" fill="#5b6170" text-anchor="middle" font-weight="normal">a read-only</text><text x="782.5" y="200.0" font-family="sans-serif" font-size="12" fill="#5b6170" text-anchor="middle" font-weight="normal">copy</text><path d="M130 180 Q150.0 180.0 161.0 180.0" fill="none" stroke="#8b91a1" stroke-width="2"/><path d="M170 180 L161.0 185.0 L161.0 175.0 z" fill="#8b91a1"/><path d="M290 180 Q305.0 180.0 311.0 180.0" fill="none" stroke="#8b91a1" stroke-width="2"/><path d="M320 180 L311.0 185.0 L311.0 175.0 z" fill="#8b91a1"/><path d="M550 140 Q565.0 140.0 571.0 140.0" fill="none" stroke="#8b91a1" stroke-width="2"/><path d="M580 140 L571.0 145.0 L571.0 135.0 z" fill="#8b91a1"/><path d="M550 240 Q565.0 240.0 571.0 240.0" fill="none" stroke="#8b91a1" stroke-width="2"/><path d="M580 240 L571.0 245.0 L571.0 235.0 z" fill="#8b91a1"/><path d="M700 180 Q715.0 180.0 721.0 180.0" fill="none" stroke="#8b91a1" stroke-width="2"/><path d="M730 180 L721.0 185.0 L721.0 175.0 z" fill="#8b91a1"/><rect x="890" y="120" width="130" height="70" rx="10" fill="#7c5cf0" stroke="#7c5cf0" stroke-width="2"/><text x="955.0" y="151.0" font-family="sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600">dashboard (M10)</text><text x="955.0" y="167.0" font-family="sans-serif" font-size="12" fill="#ece8fd" text-anchor="middle" font-weight="normal">Streamlit</text><rect x="890" y="220" width="130" height="70" rx="10" fill="#ffffff" stroke="#8b91a1" stroke-width="2"/><text x="955.0" y="243.0" font-family="sans-serif" font-size="13" fill="#1d2130" text-anchor="middle" font-weight="600">chemists</text><text x="955.0" y="259.0" font-family="sans-serif" font-size="12" fill="#5b6170" text-anchor="middle" font-weight="normal">their questions,</text><text x="955.0" y="275.0" font-family="sans-serif" font-size="12" fill="#5b6170" text-anchor="middle" font-weight="normal">answered</text><path d="M835 170 Q862.5 162.5 881.3171256088605 157.36805665212898" fill="none" stroke="#8b91a1" stroke-width="2"/><path d="M890 155 L882.632712637821 162.19187575831765 L880.0015385799 152.54423754594032 z" fill="#8b91a1"/><path d="M955 190 Q955.0 205.0 955.0 211.0" fill="none" stroke="#8b91a1" stroke-width="2"/><path d="M955 220 L950.0 211.0 L960.0 211.0 z" fill="#8b91a1"/><rect x="560" y="330" width="160" height="60" rx="10" fill="#fdf3e0" stroke="#E69F00" stroke-width="2"/><text x="640.0" y="356.0" font-family="sans-serif" font-size="13" fill="#1d2130" text-anchor="middle" font-weight="600">alerts</text><text x="640.0" y="372.0" font-family="sans-serif" font-size="12" fill="#5b6170" text-anchor="middle" font-weight="normal">kept, and sent to a chat</text><path d="M640 280 Q640.0 305.0 640.0 321.0" fill="none" stroke="#E69F00" stroke-width="2"/><path d="M640 330 L635.0 321.0 L645.0 321.0 z" fill="#E69F00"/><text x="650" y="298" font-family="sans-serif" font-size="11" fill="#E69F00" text-anchor="start" font-weight="normal">from the checks</text><rect x="150" y="350" width="360" height="70" rx="10" fill="#ffffff" stroke="#0e9fb5" stroke-width="2"/><text x="330.0" y="381.0" font-family="sans-serif" font-size="13" fill="#1d2130" text-anchor="middle" font-weight="600">CI on every pull request (M9)</text><text x="330.0" y="397.0" font-family="sans-serif" font-size="12" fill="#5b6170" text-anchor="middle" font-weight="normal">builds main and the branch on test data, tests, diffs</text><path d="M330 350 Q365.0 310.0 394.0734585291833 276.7731902523619" fill="none" stroke="#8b91a1" stroke-width="2" stroke-dasharray="5 4"/><path d="M400 270 L397.8363420027177 280.0657132917045 L390.31057505564894 273.48066721301933 z" fill="#8b91a1"/><text x="372" y="340" font-family="sans-serif" font-size="11" fill="#8b91a1" text-anchor="start" font-weight="normal">checks the dbt project</text><rect x="800" y="330" width="220" height="90" rx="10" fill="#ffffff" stroke="#8b91a1" stroke-width="2"/><text x="910.0" y="363.0" font-family="sans-serif" font-size="13" fill="#1d2130" text-anchor="middle" font-weight="600">hand-over (M11)</text><text x="910.0" y="379.0" font-family="sans-serif" font-size="12" fill="#5b6170" text-anchor="middle" font-weight="normal">dbt docs, a runbook,</text><text x="910.0" y="395.0" font-family="sans-serif" font-size="12" fill="#5b6170" text-anchor="middle" font-weight="normal">back up the snapshots</text><text x="20" y="470" font-family="sans-serif" font-size="12" fill="#8b91a1" text-anchor="start" font-weight="normal">Each week: files arrive, are loaded, snapshotted, built and tested, checked, and published; a failure at any step stops</text><text x="20" y="488" font-family="sans-serif" font-size="12" fill="#8b91a1" text-anchor="start" font-weight="normal">the week before publishing, so the dashboard keeps the last good data. Code changes go through CI first.</text></svg>