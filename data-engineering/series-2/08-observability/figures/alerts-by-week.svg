/><rect x="573" y="143" width="64" height="34" rx="6" fill="#f4f5f8"/><rect x="643" y="143" width="64" height="34" rx="6" fill="#f4f5f8"/><text x="138" y="205" font-family="sans-serif" font-size="13" fill="#1d2130" text-anchor="end" font-weight="600">registrations</text><rect x="153" y="183" width="64" height="34" rx="6" fill="#f4f5f8"/><rect x="223" y="183" width="64" height="34" rx="6" fill="#f4f5f8"/><rect x="293" y="183" width="64" height="34" rx="6" fill="#E69F00"/><text x="325.0" y="205" font-family="sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600">1</text><rect x="363" y="183" width="64" height="34" rx="6" fill="#f4f5f8"/><rect x="433" y="183" width="64" height="34" rx="6" fill="#f4f5f8"/><rect x="503" y="183" width="64" height="34" rx="6" fill="#f4f5f8"/><rect x="573" y="183" width="64" height="34" rx="6" fill="#f4f5f8"/><rect x="643" y="183" width="64" height="34" rx="6" fill="#f4f5f8"/><text x="138" y="245" font-family="sans-serif" font-size="13" fill="#1d2130" text-anchor="end" font-weight="600">drift</text><rect x="153" y="223" width="64" height="34" rx="6" fill="#f4f5f8"/><rect x="223" y="223" width="64" height="34" rx="6" fill="#f4f5f8"/><rect x="293" y="223" width="64" height="34" rx="6" fill="#f4f5f8"/><rect x="363" y="223" width="64" height="34" rx="6" fill="#f4f5f8"/><rect x="433" y="223" width="64" height="34" rx="6" fill="#f4f5f8"/><rect x="503" y="223" width="64" height="34" rx="6" fill="#f4f5f8"/><rect x="573" y="223" width="64" height="34" rx="6" fill="#E69F00"/><text x="605.0" y="245" font-family="sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600">4</text><rect x="643" y="223" width="64" height="34" rx="6" fill="#E69F00"/><text x="675.0" y="245" font-family="sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600">1</text><text x="20" y="290" font-family="sans-serif" font-size="12" fill="#8b91a1" text-anchor="start" font-weight="normal">What they were: 5: units renamed; 7: LAB-0042; 8: re-read plate; 10: late file; 11: late file + drift; 12: drift.</text><text x="20" y="310" font-family="sans-serif" font-size="12" fill="#8b91a1" text-anchor="start" font-weight="normal">Weeks 6 and 9 were quiet: a check that fires only when something happened is a check people keep reading.</text></svg>