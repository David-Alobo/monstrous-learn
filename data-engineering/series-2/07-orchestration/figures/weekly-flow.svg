<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400"><rect width="1000" height="400" fill="#ffffff"/><text x="20" y="30" font-family="sans-serif" font-size="16" fill="#1d2130" text-anchor="start" font-weight="600">The weekly flow: tasks in order, and what Prefect adds</text><rect x="20" y="150" width="118" height="70" rx="10" fill="#ffffff" stroke="#0e9fb5" stroke-width="2"/><text x="79.0" y="173.0" font-family="sans-serif" font-size="13" fill="#1d2130" text-anchor="middle" font-weight="600">receive</text><text x="79.0" y="189.0" font-family="sans-serif" font-size="12" fill="#5b6170" text-anchor="middle" font-weight="normal">the week&#x27;s files</text><text x="79.0" y="205.0" font-family="sans-serif" font-size="12" fill="#5b6170" text-anchor="middle" font-weight="normal">retries=2</text><rect x="160" y="150" width="118" height="70" rx="10" fill="#efeafd" stroke="#7c5cf0" stroke-width="2"/><text x="219.0" y="181.0" font-family="sans-serif" font-size="13" fill="#1d2130" text-anchor="middle" font-weight="600">load</text><text x="219.0" y="197.0" font-family="sans-serif" font-size="12" fill="#5b6170" text-anchor="middle" font-weight="normal">dlt: what is new</text><path d="M138 185 Q149.0 185.0 151.0 185.0" fill="none" stroke="#8b91a1" stroke-width="2"/><path d="M160 185 L151.0 190.0 L151.0 180.0 z" fill="#8b91a1"/><rect x="300" y="150" width="118" height="70" rx="10" fill="#efeafd" stroke="#7c5cf0" stroke-width="2"/><text x="359.0" y="173.0" font-family="sans-serif" font-size="13" fill="#1d2130" text-anchor="middle" font-weight="600">snapshot</text><text x="359.0" y="189.0" font-family="sans-serif" font-size="12" fill="#5b6170" text-anchor="middle" font-weight="normal">dbt: registry</text><text x="359.0" y="205.0" font-family="sans-serif" font-size="12" fill="#5b6170" text-anchor="middle" font-weight="normal">history</text><path d="M278 185 Q289.0 185.0 291.0 185.0" fill="none" stroke="#8b91a1" stroke-width="2"/><path d="M300 185 L291.0 190.0 L291.0 180.0 z" fill="#8b91a1"/><rect x="440" y="150" width="118" height="70" rx="10" fill="#efeafd" stroke="#7c5cf0" stroke-width="2"/><text x="499.0" y="173.0" font-family="sans-serif" font-size="13" fill="#1d2130" text-anchor="middle" font-weight="600">build</text><text x="499.0" y="189.0" font-family="sans-serif" font-size="12" fill="#5b6170" text-anchor="middle" font-weight="normal">dbt: build</text><text x="499.0" y="205.0" font-family="sans-serif" font-size="12" fill="#5b6170" text-anchor="middle" font-weight="normal">and test</text><path d="M418 185 Q429.0 185.0 431.0 185.0" fill="none" stroke="#8b91a1" stroke-width="2"/><path d="M440 185 L431.0 190.0 L431.0 180.0 z" fill="#8b91a1"/><rect x="580" y="150" width="118" height="70" rx="10" fill="#efeafd" stroke="#7c5cf0" stroke-width="2"/><text x="639.0" y="173.0" font-family="sans-serif" font-size="13" fill="#1d2130" text-anchor="middle" font-weight="600">check</text><text x="639.0" y="189.0" font-family="sans-serif" font-size="12" fill="#5b6170" text-anchor="middle" font-weight="normal">pandera-chem:</text><text x="639.0" y="205.0" font-family="sans-serif" font-size="12" fill="#5b6170" text-anchor="middle" font-weight="normal">warns only</text><path d="M558 185 Q569.0 185.0 571.0 185.0" fill="none" stroke="#8b91a1" stroke-width="2"/><path d="M580 185 L571.0 190.0 L571.0 180.0 z" fill="#8b91a1"/><rect x="720" y="150" width="118" height="70" rx="10" fill="#ffffff" stroke="#0e9fb5" stroke-width="2"/><text x="779.0" y="173.0" font-family="sans-serif" font-size="13" fill="#1d2130" text-anchor="middle" font-weight="600">draw</text><text x="779.0" y="189.0" font-family="sans-serif" font-size="12" fill="#5b6170" text-anchor="middle" font-weight="normal">new compounds</text><text x="779.0" y="205.0" font-family="sans-serif" font-size="12" fill="#5b6170" text-anchor="middle" font-weight="normal">cached</text><path d="M698 185 Q709.0 185.0 711.0 185.0" fill="none" stroke="#8b91a1" stroke-width="2"/><path d="M720 185 L711.0 190.0 L711.0 180.0 z" fill="#8b91a1"/><rect x="860" y="150" width="118" height="70" rx="10" fill="#7c5cf0" stroke="#7c5cf0" stroke-width="2"/><text x="919.0" y="173.0" font-family="sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600">publish</text><text x="919.0" y="189.0" font-family="sans-serif" font-size="12" fill="#ece8fd" text-anchor="middle" font-weight="normal">Parquet for</text><text x="919.0" y="205.0" font-family="sans-serif" font-size="12" fill="#ece8fd" text-anchor="middle" font-weight="normal">the dashboards</text><path d="M838 185 Q849.0 185.0 851.0 185.0" fill="none" stroke="#8b91a1" stroke-width="2"/><path d="M860 185 L851.0 190.0 L851.0 180.0 z" fill="#8b91a1"/><path d="M50 150 Q79.0 112.0 102.53994012584829 142.8454387855943" fill="none" stroke="#0e9fb5" stroke-width="2"/><path d="M108 150 L98.56518389562291 145.87880538234526 L106.51469635607367 139.81207218884333 z" fill="#0e9fb5"/><text x="79" y="108" font-family="sans-serif" font-size="11" fill="#0e9fb5" text-anchor="middle" font-weight="normal">failed? wait 1 s, try again</text><text x="79" y="122" font-family="sans-serif" font-size="11" fill="#0e9fb5" text-anchor="middle" font-weight="normal">(the share, week 9)</text><text x="779.0" y="118" font-family="sans-serif" font-size="11" fill="#0e9fb5" text-anchor="middle" font-weight="normal">same inputs as before?</text><text x="779.0" y="132" font-family="sans-serif" font-size="11" fill="#0e9fb5" text-anchor="middle" font-weight="normal">return the cached result</text><line x1="499.0" y1="220" x2="499.0" y2="268" stroke="#D55E00" stroke-width="2"/><circle cx="499.0" cy="276" r="9" fill="#D55E00"/><text x="499.0" y="280" font-family="sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">!</text><text x="515.0" y="272" font-family="sans-serif" font-size="12" fill="#D55E00" text-anchor="start" font-weight="normal">a test fails or a model breaks: the flow stops here,</text><text x="515.0" y="289" font-family="sans-serif" font-size="12" fill="#D55E00" text-anchor="start" font-weight="normal">so check, draw and publish do not run, and the</text><text x="515.0" y="306" font-family="sans-serif" font-size="12" fill="#D55E00" text-anchor="start" font-weight="normal">dashboards keep last week&#x27;s good data</text><rect x="20" y="330" width="960" height="50" rx="10" fill="#ffffff" stroke="#8b91a1" stroke-width="2"/><text x="500.0" y="351.0" font-family="sans-serif" font-size="13" fill="#1d2130" text-anchor="middle" font-weight="600">Prefect&#x27;s record</text><text x="500.0" y="367.0" font-family="sans-serif" font-size="12" fill="#5b6170" text-anchor="middle" font-weight="normal">every flow run and task run: its state, attempts, logs and times (week 9, week 10, ... week 12 failed, week 12 rerun)</text><text x="20" y="70" font-family="sans-serif" font-size="12" fill="#7c5cf0" text-anchor="start" font-weight="normal">started on a schedule (cron 0 7 * * 1: 07:00 every Monday), or when files arrive</text></svg>