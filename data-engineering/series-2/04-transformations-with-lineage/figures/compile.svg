<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300"><rect width="960" height="300" fill="#ffffff"/><text x="20" y="30" font-family="sans-serif" font-size="16" fill="#1d2130" text-anchor="start" font-weight="600">What dbt does with a model</text><rect x="20" y="60" width="270" height="170" rx="10" fill="#ffffff" stroke="#0e9fb5" stroke-width="2"/><text x="155.0" y="101.0" font-family="sans-serif" font-size="13" fill="#1d2130" text-anchor="middle" font-weight="600">models/staging/stg_results.sql</text><text x="155.0" y="117.0" font-family="sans-serif" font-size="12" fill="#5b6170" text-anchor="middle" font-weight="normal">select ... value * u.factor ...</text><text x="155.0" y="133.0" font-family="sans-serif" font-size="12" fill="#5b6170" text-anchor="middle" font-weight="normal">from {{ source(&#x27;raw&#x27;, &#x27;assay&#x27;) }}</text><text x="155.0" y="149.0" font-family="sans-serif" font-size="12" fill="#5b6170" text-anchor="middle" font-weight="normal">left join {{ ref(&#x27;unit_to_nm&#x27;) }} as u</text><text x="155.0" y="165.0" font-family="sans-serif" font-size="12" fill="#5b6170" text-anchor="middle" font-weight="normal"></text><text x="155.0" y="181.0" font-family="sans-serif" font-size="12" fill="#5b6170" text-anchor="middle" font-weight="normal">only a SELECT: no CREATE,</text><text x="155.0" y="197.0" font-family="sans-serif" font-size="12" fill="#5b6170" text-anchor="middle" font-weight="normal">no table names</text><rect x="345" y="60" width="280" height="170" rx="10" fill="#efeafd" stroke="#7c5cf0" stroke-width="2"/><text x="485.0" y="101.0" font-family="sans-serif" font-size="13" fill="#1d2130" text-anchor="middle" font-weight="600">compiled (target/compiled/)</text><text x="485.0" y="117.0" font-family="sans-serif" font-size="12" fill="#5b6170" text-anchor="middle" font-weight="normal">select ... value * u.factor ...</text><text x="485.0" y="133.0" font-family="sans-serif" font-size="12" fill="#5b6170" text-anchor="middle" font-weight="normal">from &quot;lab&quot;.&quot;raw&quot;.&quot;assay&quot;</text><text x="485.0" y="149.0" font-family="sans-serif" font-size="12" fill="#5b6170" text-anchor="middle" font-weight="normal">left join &quot;lab&quot;.&quot;staging&quot;.&quot;unit_to_nm&quot; as u</text><text x="485.0" y="165.0" font-family="sans-serif" font-size="12" fill="#5b6170" text-anchor="middle" font-weight="normal"></text><text x="485.0" y="181.0" font-family="sans-serif" font-size="12" fill="#5b6170" text-anchor="middle" font-weight="normal">ref and source become the</text><text x="485.0" y="197.0" font-family="sans-serif" font-size="12" fill="#5b6170" text-anchor="middle" font-weight="normal">tables&#x27; full names</text><rect x="680" y="60" width="260" height="170" rx="10" fill="#7c5cf0" stroke="#7c5cf0" stroke-width="2"/><text x="810.0" y="93.0" font-family="sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600">run in DuckDB</text><text x="810.0" y="109.0" font-family="sans-serif" font-size="12" fill="#ece8fd" text-anchor="middle" font-weight="normal">create or replace view &quot;lab&quot;.&quot;staging&quot;.</text><text x="810.0" y="125.0" font-family="sans-serif" font-size="12" fill="#ece8fd" text-anchor="middle" font-weight="normal">&quot;stg_results&quot; as (</text><text x="810.0" y="141.0" font-family="sans-serif" font-size="12" fill="#ece8fd" text-anchor="middle" font-weight="normal">  ... the compiled SELECT ...</text><text x="810.0" y="157.0" font-family="sans-serif" font-size="12" fill="#ece8fd" text-anchor="middle" font-weight="normal">)</text><text x="810.0" y="173.0" font-family="sans-serif" font-size="12" fill="#ece8fd" text-anchor="middle" font-weight="normal"></text><text x="810.0" y="189.0" font-family="sans-serif" font-size="12" fill="#ece8fd" text-anchor="middle" font-weight="normal">materialization: view (staging),</text><text x="810.0" y="205.0" font-family="sans-serif" font-size="12" fill="#ece8fd" text-anchor="middle" font-weight="normal">table (marts)</text><path d="M290 145 Q317.5 145.0 336.0 145.0" fill="none" stroke="#8b91a1" stroke-width="2"/><path d="M345 145 L336.0 150.0 L336.0 140.0 z" fill="#8b91a1"/><text x="317.5" y="138.0" font-family="sans-serif" font-size="12" fill="#8b91a1" text-anchor="middle" font-weight="normal">compile</text><path d="M625 145 Q652.5 145.0 671.0 145.0" fill="none" stroke="#8b91a1" stroke-width="2"/><path d="M680 145 L671.0 150.0 L671.0 140.0 z" fill="#8b91a1"/><text x="652.5" y="138.0" font-family="sans-serif" font-size="12" fill="#8b91a1" text-anchor="middle" font-weight="normal">wrap, run</text><text x="20" y="270" font-family="sans-serif" font-size="12" fill="#8b91a1" text-anchor="start" font-weight="normal">Every ref() is also an edge of the lineage graph: it is how dbt knows to build unit_to_nm before stg_results.</text></svg>