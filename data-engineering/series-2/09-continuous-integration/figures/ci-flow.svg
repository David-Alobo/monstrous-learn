<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" width="1000" height="390"><rect width="1000" height="390" fill="#ffffff"/><text x="20" y="30" font-family="sans-serif" font-size="16" fill="#1d2130" text-anchor="start" font-weight="600">Continuous integration for the warehouse: every pull request, before merging</text><rect x="20" y="140" width="150" height="80" rx="10" fill="#ffffff" stroke="#8b91a1" stroke-width="2" stroke-dasharray="5 3"/><text x="95.0" y="168.0" font-family="sans-serif" font-size="14" fill="#1d2130" text-anchor="middle" font-weight="600">pull request</text><text x="95.0" y="184.0" font-family="sans-serif" font-size="12" fill="#5b6170" text-anchor="middle" font-weight="normal">a branch: the dbt</text><text x="95.0" y="200.0" font-family="sans-serif" font-size="12" fill="#5b6170" text-anchor="middle" font-weight="normal">project, changed</text><rect x="230" y="70" width="190" height="80" rx="10" fill="#efeafd" stroke="#7c5cf0" stroke-width="2"/><text x="325.0" y="98.0" font-family="sans-serif" font-size="13" fill="#1d2130" text-anchor="middle" font-weight="600">build main (base)</text><text x="325.0" y="114.0" font-family="sans-serif" font-size="12" fill="#5b6170" text-anchor="middle" font-weight="normal">on 8 weeks of test data,</text><text x="325.0" y="130.0" font-family="sans-serif" font-size="12" fill="#5b6170" text-anchor="middle" font-weight="normal">its own warehouse</text><rect x="230" y="210" width="190" height="80" rx="10" fill="#efeafd" stroke="#7c5cf0" stroke-width="2"/><text x="325.0" y="238.0" font-family="sans-serif" font-size="13" fill="#1d2130" text-anchor="middle" font-weight="600">build the branch (head)</text><text x="325.0" y="254.0" font-family="sans-serif" font-size="12" fill="#5b6170" text-anchor="middle" font-weight="normal">same test data,</text><text x="325.0" y="270.0" font-family="sans-serif" font-size="12" fill="#5b6170" text-anchor="middle" font-weight="normal">another warehouse</text><path d="M170 165 Q200.0 137.5 223.36561273819333 116.08152165665612" fill="none" stroke="#8b91a1" stroke-width="2"/><path d="M230 110 L226.74423588078005 119.76729235765983 L219.98698959560662 112.39575095565242 z" fill="#8b91a1"/><path d="M170 195 Q200.0 222.5 223.36561273819333 243.91847834334388" fill="none" stroke="#8b91a1" stroke-width="2"/><path d="M230 250 L219.98698959560662 247.6042490443476 L226.74423588078005 240.23270764234016 z" fill="#8b91a1"/><rect x="490" y="40" width="200" height="75" rx="10" fill="#ffffff" stroke="#0e9fb5" stroke-width="2"/><text x="590.0" y="73.5" font-family="sans-serif" font-size="13" fill="#1d2130" text-anchor="middle" font-weight="600">1. tests</text><text x="590.0" y="89.5" font-family="sans-serif" font-size="12" fill="#5b6170" text-anchor="middle" font-weight="normal">do they all pass?</text><path d="M420 180 Q455.0 128.5 484.94118670251106 84.44368242344802" fill="none" stroke="#8b91a1" stroke-width="2"/><path d="M490 77 L489.07656582664885 87.25413425538633 L480.8058075783733 81.63323059150972 z" fill="#8b91a1"/><rect x="490" y="135" width="200" height="75" rx="10" fill="#ffffff" stroke="#0e9fb5" stroke-width="2"/><text x="590.0" y="160.5" font-family="sans-serif" font-size="13" fill="#1d2130" text-anchor="middle" font-weight="600">2. what it touches</text><text x="590.0" y="176.5" font-family="sans-serif" font-size="12" fill="#5b6170" text-anchor="middle" font-weight="normal">state:modified+ against</text><text x="590.0" y="192.5" font-family="sans-serif" font-size="12" fill="#5b6170" text-anchor="middle" font-weight="normal">main&#x27;s manifest</text><path d="M420 180 Q455.0 176.0 481.05820594609236 173.02191932044659" fill="none" stroke="#8b91a1" stroke-width="2"/><path d="M490 172 L481.625938901896 177.9895826837286 L480.4904729902887 168.05425595716457 z" fill="#8b91a1"/><rect x="490" y="230" width="200" height="75" rx="10" fill="#ffffff" stroke="#0e9fb5" stroke-width="2"/><text x="590.0" y="255.5" font-family="sans-serif" font-size="13" fill="#1d2130" text-anchor="middle" font-weight="600">3. data diff</text><text x="590.0" y="271.5" font-family="sans-serif" font-size="12" fill="#5b6170" text-anchor="middle" font-weight="normal">rows that differ,</text><text x="590.0" y="287.5" font-family="sans-serif" font-size="12" fill="#5b6170" text-anchor="middle" font-weight="normal">columns added/removed</text><path d="M420 180 Q455.0 223.5 484.35810840825366 259.98793473597243" fill="none" stroke="#8b91a1" stroke-width="2"/><path d="M490 267 L480.462516594905 263.1223189536093 L488.2537002216023 256.85355051833557 z" fill="#8b91a1"/><rect x="760" y="120" width="220" height="110" rx="10" fill="#7c5cf0" stroke="#7c5cf0" stroke-width="2"/><text x="870.0" y="155.0" font-family="sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600">report.md</text><text x="870.0" y="171.0" font-family="sans-serif" font-size="12" fill="#ece8fd" text-anchor="middle" font-weight="normal">on the run&#x27;s page;</text><text x="870.0" y="187.0" font-family="sans-serif" font-size="12" fill="#ece8fd" text-anchor="middle" font-weight="normal">exit code 1 if</text><text x="870.0" y="203.0" font-family="sans-serif" font-size="12" fill="#ece8fd" text-anchor="middle" font-weight="normal">anything failed</text><path d="M690 77 Q725.0 126.0 754.7688562565281 167.67639875913937" fill="none" stroke="#8b91a1" stroke-width="2"/><path d="M760 175 L750.7001889004945 170.58258972773484 L758.8375236125618 164.7702077905439 z" fill="#8b91a1"/><path d="M690 172 Q725.0 173.5 751.008253937641 174.61463945447034" fill="none" stroke="#8b91a1" stroke-width="2"/><path d="M760 175 L750.7941647456801 179.61005393355867 L751.222343129602 169.619224975382 z" fill="#8b91a1"/><path d="M690 267 Q725.0 221.0 754.5503035076506 182.16245824708773" fill="none" stroke="#8b91a1" stroke-width="2"/><path d="M760 175 L758.5294469782549 185.19006740950405 L750.5711600370463 179.1348490846714 z" fill="#8b91a1"/><circle cx="775" cy="262" r="9" fill="#009E73"/><text x="792" y="267" font-family="sans-serif" font-size="12" fill="#009E73" text-anchor="start" font-weight="normal">passed: a person reviews,</text><text x="792" y="283" font-family="sans-serif" font-size="12" fill="#009E73" text-anchor="start" font-weight="normal">then merges</text><circle cx="775" cy="310" r="9" fill="#D55E00"/><text x="792" y="315" font-family="sans-serif" font-size="12" fill="#D55E00" text-anchor="start" font-weight="normal">failed: branch protection</text><text x="792" y="331" font-family="sans-serif" font-size="12" fill="#D55E00" text-anchor="start" font-weight="normal">blocks the merge until fixed</text><text x="20" y="370" font-family="sans-serif" font-size="12" fill="#8b91a1" text-anchor="start" font-weight="normal">Test data, not production: the two builds differ only by the change, and CI never needs the lab&#x27;s real data or passwords.</text></svg>