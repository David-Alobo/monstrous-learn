<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 280" width="960" height="280"><rect width="960" height="280" fill="#ffffff"/><text x="20" y="30" font-family="sans-serif" font-size="16" fill="#1d2130" text-anchor="start" font-weight="600">One writer, many readers: the dashboard reads a published copy</text><rect x="20" y="80" width="190" height="90" rx="10" fill="#efeafd" stroke="#7c5cf0" stroke-width="2"/><text x="115.0" y="113.0" font-family="sans-serif" font-size="14" fill="#1d2130" text-anchor="middle" font-weight="600">weekly pipeline</text><text x="115.0" y="129.0" font-family="sans-serif" font-size="12" fill="#5b6170" text-anchor="middle" font-weight="normal">dlt and dbt write</text><text x="115.0" y="145.0" font-family="sans-serif" font-size="12" fill="#5b6170" text-anchor="middle" font-weight="normal">while they run</text><rect x="280" y="80" width="200" height="90" rx="10" fill="#ffffff" stroke="#8b91a1" stroke-width="2"/><text x="380.0" y="113.0" font-family="sans-serif" font-size="13" fill="#1d2130" text-anchor="middle" font-weight="600">work/lab.duckdb</text><text x="380.0" y="129.0" font-family="sans-serif" font-size="12" fill="#5b6170" text-anchor="middle" font-weight="normal">the working warehouse:</text><text x="380.0" y="145.0" font-family="sans-serif" font-size="12" fill="#5b6170" text-anchor="middle" font-weight="normal">locked while written</text><rect x="560" y="80" width="200" height="90" rx="10" fill="#7c5cf0" stroke="#7c5cf0" stroke-width="2"/><text x="660.0" y="113.0" font-family="sans-serif" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="600">published/lab.duckdb</text><text x="660.0" y="129.0" font-family="sans-serif" font-size="12" fill="#ece8fd" text-anchor="middle" font-weight="normal">a copy, made after</text><text x="660.0" y="145.0" font-family="sans-serif" font-size="12" fill="#ece8fd" text-anchor="middle" font-weight="normal">each good build</text><rect x="820" y="50" width="120" height="42" rx="10" fill="#ffffff" stroke="#0e9fb5" stroke-width="2"/><text x="880.0" y="76.0" font-family="sans-serif" font-size="12" fill="#1d2130" text-anchor="middle" font-weight="600">chemist 1</text><path d="M760 125 Q790.0 98.0 813.3103526837755 77.02068258460204" fill="none" stroke="#8b91a1" stroke-width="2"/><path d="M820 71 L816.6551763418877 80.73715331583787 L809.9655290256633 73.30421185336621 z" fill="#8b91a1"/><rect x="820" y="105" width="120" height="42" rx="10" fill="#ffffff" stroke="#0e9fb5" stroke-width="2"/><text x="880.0" y="131.0" font-family="sans-serif" font-size="12" fill="#1d2130" text-anchor="middle" font-weight="600">chemist 2</text><path d="M760 125 Q790.0 125.5 811.0012497396436 125.85002082899406" fill="none" stroke="#8b91a1" stroke-width="2"/><path d="M820 126 L810.9179279779737 130.84932652919207 L811.0845715013136 120.85071512879605 z" fill="#8b91a1"/><rect x="820" y="160" width="120" height="42" rx="10" fill="#ffffff" stroke="#0e9fb5" stroke-width="2"/><text x="880.0" y="186.0" font-family="sans-serif" font-size="12" fill="#1d2130" text-anchor="middle" font-weight="600">chemist 3</text><path d="M760 125 Q790.0 153.0 813.4205025858142 174.8591357467599" fill="none" stroke="#8b91a1" stroke-width="2"/><path d="M820 181 L810.0089113340142 178.51441208797425 L816.8320938376143 171.20385940554556 z" fill="#8b91a1"/><path d="M210 125 Q245.0 125.0 271.0 125.0" fill="none" stroke="#8b91a1" stroke-width="2"/><path d="M280 125 L271.0 130.0 L271.0 120.0 z" fill="#8b91a1"/><text x="245.0" y="118.0" font-family="sans-serif" font-size="12" fill="#8b91a1" text-anchor="middle" font-weight="normal">write</text><path d="M480 125 Q520.0 125.0 551.0 125.0" fill="none" stroke="#8b91a1" stroke-width="2"/><path d="M560 125 L551.0 130.0 L551.0 120.0 z" fill="#8b91a1"/><text x="520.0" y="118.0" font-family="sans-serif" font-size="12" fill="#8b91a1" text-anchor="middle" font-weight="normal">copy (publish)</text><text x="820" y="225" font-family="sans-serif" font-size="12" fill="#8b91a1" text-anchor="start" font-weight="normal">Streamlit, read-only</text><text x="20" y="220" font-family="sans-serif" font-size="12" fill="#8b91a1" text-anchor="start" font-weight="normal">DuckDB lets one program write a file at a time, and nobody else open it then; the copy can be read at any time,</text><text x="20" y="238" font-family="sans-serif" font-size="12" fill="#8b91a1" text-anchor="start" font-weight="normal">and a failed build never reaches it: the dashboard keeps the last good data.</text></svg>