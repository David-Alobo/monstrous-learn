# The databases the courses use, the same on Windows, macOS and Linux. How to install Docker and
# what to do when something goes wrong: README.md next to this file.
#
# Passwords live in the file .env at the repository's root (copy .env.example and choose your
# own), never in this file. From the repository's root:
#
#   docker compose --env-file .env -f shared/docker/compose.yml up -d postgres neo4j   # start
#   docker compose --env-file .env -f shared/docker/compose.yml down                   # stop (data kept)
#   docker compose --env-file .env -f shared/docker/compose.yml down -v                # stop, delete data
#
# Images are pinned to exact versions, so every learner gets the same database.
services:
  postgres:
    # PostgreSQL 17 with the RDKit cartridge (https://github.com/InformaticsMatters/docker-rdkit)
    image: informaticsmatters/rdkit-cartridge-debian:Release_2026_09_1
    restart: unless-stopped  # back whenever Docker starts, until you stop it
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      # UTF-8 text; without it this image creates the database as SQL_ASCII, and Python then
      # receives every text value as bytes (b'...')
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    ports:
      - "127.0.0.1:5432:5432"  # this computer only (IPv4 and IPv6): never open a database to the network
      - "[::1]:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro  # creates the rdkit extension on first start
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 20

  neo4j:
    # the official Neo4j image, Community edition
    image: neo4j:5.26-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:?set NEO4J_USER in .env}/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
    ports:
      - "127.0.0.1:7474:7474"  # the browser interface: http://localhost:7474
      - "[::1]:7474:7474"
      - "127.0.0.1:7687:7687"  # the Bolt protocol, used by the Python driver
      - "[::1]:7687:7687"
    volumes:
      - neo4j-data:/data

volumes:
  postgres-data:
  neo4j-data:
