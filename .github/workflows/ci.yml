name: tests
on: [push, pull_request]
jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - run: uv run python -m shared.site.build
      # the course pages' JavaScript (the big-picture diagram), tested with Vitest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
  series-1:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data-engineering/series-1
    # the same databases as shared/docker/compose.yml, so lesson code marked "# needs: postgres"
    # or "# needs: neo4j" is tested too
    services:
      postgres:
        image: informaticsmatters/rdkit-cartridge-debian:Release_2026_09_1
        env:
          POSTGRES_USER: learn
          POSTGRES_PASSWORD: learn
          POSTGRES_DB: chem
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U learn -d chem" --health-interval 5s --health-retries 20
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/learn-neo4j
        ports: ["7687:7687"]
    env:
      DATABASE_URL: postgresql://learn:learn@localhost:5432/chem
      NEO4J_URI: bolt://localhost:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: learn-neo4j
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run ruff check .
      - name: Install the RDKit cartridge and wait for Neo4j
        run: |
          uv run python - <<'EOF'
          import os, time
          import psycopg
          from neo4j import GraphDatabase
          with psycopg.connect(os.environ["DATABASE_URL"], autocommit=True) as db:
              db.execute("CREATE EXTENSION IF NOT EXISTS rdkit")
          for _ in range(60):
              try:
                  auth = (os.environ["NEO4J_USER"], os.environ["NEO4J_PASSWORD"])
                  GraphDatabase.driver(os.environ["NEO4J_URI"], auth=auth).verify_connectivity()
                  break
              except Exception:
                  time.sleep(2)
          EOF
      - run: uv run pytest
