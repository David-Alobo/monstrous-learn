[project]
name = "monstrous-learn"
version = "0.1.0"
description = "Monstrous Data's free courses: data engineering for chemists. The site builder and shared tooling; each series has its own environment in its folder."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "David Obeh Alobo", email = "david.alobo@monstrous.com.ng" }]
dependencies = ["markdown>=3.7", "pygments>=2.18"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py311"
# lessons (Markdown) and the files made from them are laid out for reading, not by the formatter
extend-exclude = ["*.md", "**/code.py", "**/notebook.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
